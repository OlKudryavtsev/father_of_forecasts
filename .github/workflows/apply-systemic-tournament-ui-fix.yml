name: Apply systemic tournament UI fix

on:
  push:
    branches:
      - assistant/systemic-tournament-ui-fix

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Refactor tournament state, header and team identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          ROOT = Path('.')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Cannot find {label}')
              return text.replace(old, new, 1)

          def re_once(text, pattern, replacement, label):
              result, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, got {count}')
              return result

          team_identity = r'''"""Canonical team identity for Mini App payloads.

          UI code must not guess club logos or mutate API responses.  This module is the
          single server-side place that translates known club aliases, resolves the
          association flag, and constructs an API-Sports crest URL from the team id that
          is already stored on the Match row.
          """

          from __future__ import annotations

          import re
          import unicodedata
          from functools import lru_cache

          from app.constants.teams import TEAM_FLAG_CODES, TEAM_FLAGS
          from app.team_names import get_team_name_ru


          # name_ru, association flag code, aliases used by imported/API fixtures.
          # Logo ids intentionally do NOT live here: the real Match.external_team_id is
          # the source of truth for crests.
          CLUB_IDENTITIES = (
              ("АЕК Афины", "gr", ("AEK Athens", "AEK", "AEK Athens FC", "АЕК Афины")),
              ("Арсенал", "gb-eng", ("Arsenal", "Arsenal FC", "Арсенал")),
              ("Астон Вилла", "gb-eng", ("Aston Villa", "Aston Villa FC", "Астон Вилла")),
              ("Атлетико Мадрид", "es", ("Atletico Madrid", "Atlético Madrid", "Atleti", "Atl. Madrid", "Атлетико Мадрид")),
              ("Барселона", "es", ("Barcelona", "FC Barcelona", "Барселона")),
              ("Бавария", "de", ("Bayern Munich", "Bayern München", "FC Bayern Munich", "Bayern", "Бавария")),
              ("Будё-Глимт", "no", ("Bodo/Glimt", "Bodø/Glimt", "Bodoe/Glimt", "Bodo Glimt", "Будё-Глимт")),
              ("Боруссия Дортмунд", "de", ("Borussia Dortmund", "Dortmund", "B. Dortmund", "Боруссия Дортмунд")),
              ("Брюгге", "be", ("Club Brugge", "Club Brugge KV", "Brugge", "Брюгге")),
              ("Комо", "it", ("Como", "Como 1907", "Комо")),
              ("Фенербахче", "tr", ("Fenerbahce", "Fenerbahçe", "Fenerbahce SK", "Фенербахче")),
              ("Фейеноорд", "nl", ("Feyenoord", "Feyenoord Rotterdam", "Фейеноорд")),
              ("Галатасарай", "tr", ("Galatasaray", "Galatasaray SK", "Галатасарай")),
              ("Интер", "it", ("Inter", "Inter Milan", "Internazionale", "Интер")),
              ("ЛАСК", "at", ("LASK", "Lask Linz", "LASK Linz", "ЛАСК")),
              ("Ланс", "fr", ("Lens", "RC Lens", "Ланс")),
              ("Лейпциг", "de", ("Leipzig", "RB Leipzig", "RasenBallsport Leipzig", "Лейпциг")),
              ("Лилль", "fr", ("Lille", "LOSC Lille", "Лилль")),
              ("Ливерпуль", "gb-eng", ("Liverpool", "Liverpool FC", "Ливерпуль")),
              ("Манчестер Сити", "gb-eng", ("Manchester City", "Man City", "Манчестер Сити")),
              ("Манчестер Юнайтед", "gb-eng", ("Manchester United", "Man Utd", "Manchester Utd", "Манчестер Юнайтед")),
              ("Наполи", "it", ("Napoli", "SSC Napoli", "Наполи")),
              ("Нанси", "fr", ("Nancy", "AS Nancy", "Nancy Lorraine", "Нанси")),
              ("ПСЖ", "fr", ("Paris Saint-Germain", "Paris SG", "PSG", "Paris", "ПСЖ")),
              ("Порту", "pt", ("Porto", "FC Porto", "Порту")),
              ("ПСВ", "nl", ("PSV Eindhoven", "PSV", "ПСВ")),
              ("Бетис", "es", ("Real Betis", "Betis", "Бетис")),
              ("Реал Мадрид", "es", ("Real Madrid", "Real Madrid CF", "Реал Мадрид")),
              ("Рома", "it", ("Roma", "AS Roma", "Рома")),
              ("Сабах", "az", ("Sabah", "Sabah FA", "Sabah FK", "Сабах")),
              ("Славия Прага", "cz", ("Slavia Praha", "Slavia Prague", "SK Slavia Praha", "Славия Прага")),
              ("Спортинг", "pt", ("Sporting CP", "Sporting Lisbon", "Sporting", "Спортинг")),
              ("Тоттенхэм", "gb-eng", ("Tottenham", "Tottenham Hotspur", "Spurs", "Тоттенхэм")),
              ("Викинг", "no", ("Viking", "Viking FK", "Викинг")),
              ("Вильярреал", "es", ("Villarreal", "Villarreal CF", "Вильярреал")),
              ("Висла Краков", "pl", ("Wisla Krakow", "Wisła Kraków", "Wisla Kraków", "Wisla Krakow SA", "Висла Краков")),
              ("Шахтёр", "ua", ("Shakhtar Donetsk", "Shakhtar", "FC Shakhtar Donetsk", "Шахтер", "Шахтёр")),
              ("Штутгарт", "de", ("VfB Stuttgart", "Stuttgart", "Штутгарт")),
              ("Слован Братислава", "sk", ("Slovan Bratislava", "ŠK Slovan Bratislava", "SK Slovan Bratislava", "Слован", "Слован Братислава")),
              ("Карабах", "az", ("Qarabag", "Qarabağ", "Qarabag FK", "Карабах")),
              ("Бенфика", "pt", ("Benfica", "SL Benfica", "Бенфика")),
              ("Аякс", "nl", ("Ajax", "Ajax Amsterdam", "Аякс")),
              ("Ювентус", "it", ("Juventus", "Juventus FC", "Ювентус")),
              ("Аталанта", "it", ("Atalanta", "Atalanta BC", "Аталанта")),
              ("Монако", "fr", ("Monaco", "AS Monaco", "Монако")),
              ("Марсель", "fr", ("Marseille", "Olympique Marseille", "Olympique de Marseille", "Марсель")),
              ("Олимпиакос", "gr", ("Olympiakos", "Olympiacos", "Olympiacos Piraeus", "Олимпиакос")),
              ("Селтик", "gb-sct", ("Celtic", "Celtic FC", "Селтик")),
              ("Ньюкасл", "gb-eng", ("Newcastle", "Newcastle United", "Ньюкасл")),
              ("Челси", "gb-eng", ("Chelsea", "Chelsea FC", "Челси")),
          )


          def normalize_team_name(value: str | None) -> str:
              text = unicodedata.normalize("NFKD", str(value or "")).casefold()
              text = "".join(char for char in text if not unicodedata.combining(char))
              text = text.replace("ё", "е")
              text = re.sub(r"[«»\"'`]", "", text)
              text = re.sub(r"\b(fc|cf|sc|sk|fk|kv|sa|club|football|team)\b", " ", text)
              return re.sub(r"[^a-zа-я0-9]+", " ", text).strip()


          _CLUB_BY_ALIAS: dict[str, dict] = {}
          for _name_ru, _flag_code, _aliases in CLUB_IDENTITIES:
              _meta = {"name": _name_ru, "flag_code": _flag_code}
              for _alias in _aliases:
                  _CLUB_BY_ALIAS[normalize_team_name(_alias)] = _meta


          def _flag_emoji(flag_code: str) -> str:
              code = (flag_code or "").lower()
              if len(code) == 2 and code.isalpha():
                  return "".join(chr(127397 + ord(char.upper())) for char in code)
              # Subdivision flags are rendered from flagcdn in the client.  This is
              # only an emoji fallback for clients where that image cannot load.
              if code.startswith("gb-"):
                  return "🏴"
              return ""


          def api_sports_team_logo(external_team_id: int | str | None) -> str:
              try:
                  team_id = int(external_team_id or 0)
              except (TypeError, ValueError):
                  return ""
              if team_id <= 0:
                  return ""
              return f"https://media.api-sports.io/football/teams/{team_id}.png"


          @lru_cache(maxsize=512)
          def get_team_identity(
              team_name: str | None,
              api_name: str | None = None,
              external_team_id: int | str | None = None,
              tournament_code: str | None = None,
          ) -> dict:
              club = _CLUB_BY_ALIAS.get(normalize_team_name(api_name)) or _CLUB_BY_ALIAS.get(normalize_team_name(team_name))
              if club:
                  display_name = club["name"]
                  flag_code = club["flag_code"]
                  flag = _flag_emoji(flag_code)
              else:
                  display_name = get_team_name_ru(team_name)
                  flag = TEAM_FLAGS.get(api_name or "") or TEAM_FLAGS.get(display_name) or TEAM_FLAGS.get(team_name or "") or ""
                  flag_code = TEAM_FLAG_CODES.get(api_name or "") or TEAM_FLAG_CODES.get(display_name) or TEAM_FLAG_CODES.get(team_name or "") or ""

              code = str(tournament_code or "").casefold()
              is_club_tournament = bool(club) or code.startswith("ucl_") or code.startswith("ucl-")
              logo = api_sports_team_logo(external_team_id) if is_club_tournament else ""

              return {
                  "name": display_name,
                  "flag": flag,
                  "flag_code": flag_code,
                  "logo": logo,
              }
          '''
          (ROOT / 'app/services/team_identity.py').write_text(textwrap.dedent(team_identity).lstrip(), encoding='utf-8')

          webapp_path = ROOT / 'app/api/webapp.py'
          webapp = webapp_path.read_text(encoding='utf-8')
          webapp = replace_once(
              webapp,
              'from app.services.misc import build_table_rows, get_team_flag, get_team_flag_code\n',
              'from app.services.misc import build_table_rows, get_team_flag, get_team_flag_code\nfrom app.services.team_identity import get_team_identity\n',
              'team identity import',
          )
          old_serializer = '''def _serialize_match(match: Match, user_prediction: Prediction | None = None) -> dict:\n    """Serialize a match for the Mini App API."""\n    home_name = get_team_name_ru(match.home_team)\n    away_name = get_team_name_ru(match.away_team)\n\n    return {\n        "id": match.id,\n        "tournament_code": match.tournament_code,\n        "label": _match_label(match),\n        "home_team": home_name,\n        "away_team": away_name,\n        "home_flag": get_team_flag(home_name, getattr(match, "home_team_api_name", None)),\n        "away_flag": get_team_flag(away_name, getattr(match, "away_team_api_name", None)),\n        "home_flag_code": get_team_flag_code(home_name, getattr(match, "home_team_api_name", None)),\n        "away_flag_code": get_team_flag_code(away_name, getattr(match, "away_team_api_name", None)),\n        "home_team_id": match.home_external_team_id,\n        "away_team_id": match.away_external_team_id,\n'''
          new_serializer = '''def _serialize_match(match: Match, user_prediction: Prediction | None = None) -> dict:\n    """Serialize a match for the Mini App API from canonical server-side team identity."""\n    home = get_team_identity(\n        match.home_team,\n        getattr(match, "home_team_api_name", None),\n        match.home_external_team_id,\n        match.tournament_code,\n    )\n    away = get_team_identity(\n        match.away_team,\n        getattr(match, "away_team_api_name", None),\n        match.away_external_team_id,\n        match.tournament_code,\n    )\n\n    return {\n        "id": match.id,\n        "tournament_code": match.tournament_code,\n        "label": _match_label(match),\n        "home_team": home["name"],\n        "away_team": away["name"],\n        "home_flag": home["flag"],\n        "away_flag": away["flag"],\n        "home_flag_code": home["flag_code"],\n        "away_flag_code": away["flag_code"],\n        "home_logo": home["logo"],\n        "away_logo": away["logo"],\n        "home_team_id": match.home_external_team_id,\n        "away_team_id": match.away_external_team_id,\n'''
          webapp = replace_once(webapp, old_serializer, new_serializer, 'match serializer')
          webapp_path.write_text(webapp, encoding='utf-8')

          main_path = ROOT / 'app/miniapp_frontend/src/main.jsx'
          main = main_path.read_text(encoding='utf-8')

          team_flag_component = r'''function TeamFlag({ code, emoji, name = '', size = 'normal', logo = '' }) {
            const [logoFailed, setLogoFailed] = useState(false);
            const normalizedCode = String(code || '').trim().toLowerCase();
            const hasCode = /^[a-z0-9-]{2,10}$/.test(normalizedCode);
            const className = `flag flag-img ${size === 'mini' ? 'mini' : ''}`.trim();

            useEffect(() => {
              setLogoFailed(false);
            }, [logo]);

            if (logo && !logoFailed) {
              return (
                <span className={`${className} club-mark`.trim()} title={name} aria-label={name ? `Эмблема: ${name}` : 'Эмблема клуба'}>
                  <img
                    className="club-mark-logo"
                    src={logo}
                    alt=""
                    loading="lazy"
                    onError={() => setLogoFailed(true)}
                  />
                  {(hasCode || emoji) && (
                    <span className="club-mark-country" aria-label={name ? `Страна клуба: ${name}` : 'Страна клуба'}>
                      {hasCode
                        ? <img src={`https://flagcdn.com/${normalizedCode}.svg`} alt="" loading="lazy" />
                        : <span>{emoji}</span>}
                    </span>
                  )}
                </span>
              );
            }

            if (hasCode) {
              return (
                <span className={className} title={name} aria-label={name ? `Флаг: ${name}` : 'Флаг'}>
                  <img
                    src={`https://flagcdn.com/${normalizedCode}.svg`}
                    alt=""
                    loading="lazy"
                    onError={(event) => {
                      const img = event.currentTarget;
                      img.style.display = 'none';
                      const parent = img.parentElement;
                      if (parent) parent.classList.add('flag-fallback-visible');
                    }}
                  />
                  <span className="flag-fallback">{emoji || normalizedCode.toUpperCase()}</span>
                </span>
              );
            }

            return <span className={`flag ${size === 'mini' ? 'mini' : ''}`.trim()} title={name}>{emoji || '🏳️'}</span>;
          }

          function Icon'''
          main = re_once(
              main,
              r"function TeamFlag\(\{ code, emoji, name = '', size = 'normal' \}\) \{.*?\n\}\n\nfunction Icon",
              team_flag_component,
              'TeamFlag component',
          )

          header_component = r'''function Header({ dashboard, onRules, onAdmin, leagues = [], activeLeagueId, onLeagueChange, tournaments = [], activeTournamentCode, onTournamentChange }) {
            const selectedTournament = tournaments.find((item) => item.code === activeTournamentCode) || null;
            const dashboardTournamentCode = dashboard?.tournament?.code || null;
            const dashboardMatchesSelection = !dashboardTournamentCode || dashboardTournamentCode === activeTournamentCode;
            const currentDashboard = dashboardMatchesSelection ? dashboard : null;
            const tournament = currentDashboard?.tournament || selectedTournament || {};
            const stageText = currentDashboard
              ? (tournament.current_stage_label || (tournament.is_started ? 'Турнир идет' : 'До старта'))
              : 'Загружаю…';
            const tournamentTitle = tournament.name || tournament.short_name || 'Турнир';
            const tournamentHost = tournament.host || '';

            return (
              <header className="league-header">
                <div className="league-main">
                  <div className="league-logo"><Icon name="cup" /></div>
                  <div className="league-text">
                    <h1>Отец прогнозов</h1>
                    <div className="league-subtitle">{tournamentTitle}{tournamentHost ? ` · ${tournamentHost}` : ''}</div>
                  </div>
                  {currentDashboard?.user?.is_admin && (
                    <button className="header-admin-button" onClick={onAdmin} aria-label="Администрирование" title="Администрирование">
                      <Icon name="shield" />
                    </button>
                  )}
                  <button className="rules-button" onClick={onRules}>Правила</button>
                </div>

                <div className="league-status-row">
                  <div className="league-status">
                    <HeaderTournamentSelector tournaments={tournaments} activeTournamentCode={activeTournamentCode} onChange={onTournamentChange} />
                    <HeaderLeagueSelector leagues={leagues} activeLeagueId={activeLeagueId} onChange={onLeagueChange} />
                    <span className="status-section live-countdown header-stat header-stage">{stageText}</span>
                    <span className="points header-stat header-points">{currentDashboard ? pointsLabel(currentDashboard.points ?? 0) : '…'}</span>
                    <span className="muted header-stat header-rank">#{currentDashboard?.rank || '—'}</span>
                  </div>
                </div>
              </header>
            );
          }

          function TournamentScorerAvatar'''
          main = re_once(
              main,
              r"function Header\(\{ dashboard, onRules, onAdmin, leagues = \[\], activeLeagueId, onLeagueChange, tournaments = \[\], activeTournamentCode, onTournamentChange \}\) \{.*?\n\}\n\nfunction TournamentScorerAvatar",
              header_component,
              'Header component',
          )

          main = replace_once(
              main,
              "  const [rulesOpen, setRulesOpen] = useState(false);\n  const hasBrowserSession = Boolean(getWebSessionToken());",
              "  const [rulesOpen, setRulesOpen] = useState(false);\n  const dashboardRequestRef = useRef({ requestId: 0, controller: null });\n  const hasBrowserSession = Boolean(getWebSessionToken());",
              'dashboard request ref',
          )

          dashboard_loader = r'''  async function loadDashboard() {
            const requestId = dashboardRequestRef.current.requestId + 1;
            dashboardRequestRef.current.requestId = requestId;
            dashboardRequestRef.current.controller?.abort();
            const controller = new AbortController();
            dashboardRequestRef.current.controller = controller;
            const requestedLeagueId = activeLeagueId;
            const requestedTournamentCode = activeTournamentCode;

            try {
              setDashboardError(null);
              const dashboardParams = new URLSearchParams();
              if (requestedLeagueId) dashboardParams.set('league_id', String(requestedLeagueId));
              if (requestedTournamentCode) dashboardParams.set('tournament_code', requestedTournamentCode);
              const dashboardQuery = dashboardParams.toString() ? `?${dashboardParams.toString()}` : '';
              const [dashboardResult, tournamentPredictionResult] = await Promise.all([
                api(`/api/webapp/dashboard${dashboardQuery}`, { signal: controller.signal }),
                api(`/api/webapp/tournament-prediction/me${requestedTournamentCode ? `?tournament_code=${encodeURIComponent(requestedTournamentCode)}` : ''}`, { signal: controller.signal })
                  .catch((error) => {
                    if (error?.name === 'AbortError') throw error;
                    return null;
                  }),
              ]);

              if (controller.signal.aborted || dashboardRequestRef.current.requestId !== requestId) return;
              if (requestedTournamentCode && dashboardResult?.tournament?.code && dashboardResult.tournament.code !== requestedTournamentCode) return;

              setDashboard(dashboardResult);
              setTournamentPrediction(tournamentPredictionResult);
            } catch (err) {
              if (err?.name === 'AbortError') return;
              if (dashboardRequestRef.current.requestId === requestId) setDashboardError(err);
            }
          }

          useEffect(() => {
            if (!isTelegramMode() && !hasBrowserSession) return;
            loadDashboard();
          }, [refreshKey, hasBrowserSession, activeLeagueId, activeTournamentCode]);

          useEffect(() => () => {
            dashboardRequestRef.current.requestId += 1;
            dashboardRequestRef.current.controller?.abort();
          }, []);'''
          main = re_once(
              main,
              r"  async function loadDashboard\(\) \{.*?\n  \}\n\n  useEffect\(\(\) => \{\n    if \(!isTelegramMode\(\) && !hasBrowserSession\) return;\n    loadDashboard\(\);\n  \}, \[refreshKey, hasBrowserSession, activeLeagueId, activeTournamentCode\]\);",
              dashboard_loader,
              'dashboard loader',
          )

          selection_functions = r'''  function invalidateDashboardSelection() {
            dashboardRequestRef.current.requestId += 1;
            dashboardRequestRef.current.controller?.abort();
            dashboardRequestRef.current.controller = null;
            setDashboard(null);
            setTournamentPrediction(null);
            setDashboardError(null);
          }

          function setActiveLeagueId(nextLeagueId) {
            const normalized = Number(nextLeagueId) || null;
            if (normalized !== activeLeagueId) invalidateDashboardSelection();
            setActiveLeagueIdState(normalized);
            if (normalized) {
              localStorage.setItem('ff_active_league_id', String(normalized));
            } else {
              localStorage.removeItem('ff_active_league_id');
            }
          }

          function setActiveTournamentCode(nextCode) {
            const normalized = String(nextCode || 'wc2026');
            if (normalized === activeTournamentCode) return;
            invalidateDashboardSelection();
            setActiveTournamentCodeState(normalized);
            localStorage.setItem('ff_active_tournament_code', normalized);
          }

          async function loadTournaments()'''
          main = re_once(
              main,
              r"  function setActiveLeagueId\(nextLeagueId\) \{.*?\n  \}\n\n  function setActiveTournamentCode\(nextCode\) \{.*?\n  \}\n\n  async function loadTournaments\(\)",
              selection_functions,
              'selection functions',
          )

          logo_replacements = {
              '<TeamFlag code={match.home_flag_code} emoji={match.home_flag} name={match.home_team}': '<TeamFlag code={match.home_flag_code} emoji={match.home_flag} logo={match.home_logo} name={match.home_team}',
              '<TeamFlag code={match.away_flag_code} emoji={match.away_flag} name={match.away_team}': '<TeamFlag code={match.away_flag_code} emoji={match.away_flag} logo={match.away_logo} name={match.away_team}',
              '<TeamFlag code={currentMatch.home_flag_code} emoji={currentMatch.home_flag} name={currentMatch.home_team}': '<TeamFlag code={currentMatch.home_flag_code} emoji={currentMatch.home_flag} logo={currentMatch.home_logo} name={currentMatch.home_team}',
              '<TeamFlag code={currentMatch.away_flag_code} emoji={currentMatch.away_flag} name={currentMatch.away_team}': '<TeamFlag code={currentMatch.away_flag_code} emoji={currentMatch.away_flag} logo={currentMatch.away_logo} name={currentMatch.away_team}',
              '<TeamFlag code={team.flag_code} emoji={team.flag} name={team.name} size="mini"': '<TeamFlag code={team.flag_code} emoji={team.flag} logo={team.logo} name={team.name} size="mini"',
          }
          for old, new in logo_replacements.items():
              main = main.replace(old, new)

          main_path.write_text(main, encoding='utf-8')

          css_path = ROOT / 'app/miniapp_frontend/src/styles.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Canonical tournament header and club identity (v3.9.15) */'
          if marker in css:
              raise SystemExit('Canonical CSS marker already present')
          css += r'''

          /* Canonical tournament header and club identity (v3.9.15) */
          .league-header {
            padding-bottom: 8px;
            margin-bottom: 8px;
          }

          .league-main {
            grid-template-columns: 44px minmax(0, 1fr) 40px auto;
            gap: 8px;
          }

          .league-main .rules-button,
          .league-main .header-admin-button {
            height: 40px;
            min-height: 40px;
            max-height: 40px;
            border-radius: 13px;
          }

          .league-main .rules-button {
            min-width: 0;
            padding: 0 14px;
          }

          .league-main .header-admin-button {
            width: 40px;
            min-width: 40px;
            max-width: 40px;
            padding: 0;
            display: grid;
            place-items: center;
            color: #70a2ff;
            background: rgba(35, 53, 91, .88);
            border: 1px solid rgba(90, 141, 255, .40);
          }

          .league-main .header-admin-button .svg-icon {
            width: 21px;
            height: 21px;
          }

