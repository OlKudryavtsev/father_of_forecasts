name: Apply systemic tournament UI fix

on:
  push:
    branches:
      - assistant/systemic-tournament-ui-fix

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Recover and run the reviewed refactor script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-systemic-tournament-ui-fix.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/apply_systemic_fix.py
          test -s /tmp/apply_systemic_fix.py
          python /tmp/apply_systemic_fix.py

      - name: Python syntax and focused identity tests
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py

      - name: Build Mini App
        working-directory: app/miniapp_frontend
        run: |
          npm ci
          npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make tournament UI state and team identity canonical"
          git push origin HEAD:${GITHUB_REF_NAME}
