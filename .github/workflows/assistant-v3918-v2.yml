name: Build v3.9.18 compact match cards v2

on:
  push:
    branches:
      - assistant/v3.9.18-compact-match-actions

permissions:
  contents: write

concurrency:
  group: assistant-v3918-compact-match-actions-v2
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Apply compact match-card refactor
        shell: bash
        run: |
          git show f29c81ab21123ee73de1657858e458db2fc3472e:.github/workflows/assistant-v3918.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/apply_v3918.py
          test -s /tmp/apply_v3918.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_v3918.py')
          text = p.read_text(encoding='utf-8')
          old = '''def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Cannot find {label}')
              return text.replace(old, new, 1)'''
          new = '''def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              # Source formatting changes should not turn a structural UI edit
              # into a brittle patch. Ignore leading indentation while keeping
              # the actual JSX/Python text exact.
              lines = old.splitlines()
              pattern_parts = []
              for line in lines:
                  stripped = line.lstrip()
                  pattern_parts.append(r"[ \\t]*" + re.escape(stripped) if stripped else r"[ \\t]*")
              pattern = r"\\n".join(pattern_parts)
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f'Cannot find {label}')
              return text[:match.start()] + new + text[match.end():]'''
          if old not in text:
              raise SystemExit('Cannot patch replace_once helper')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python /tmp/apply_v3918.py

      - name: Sync app version assets
        run: node app/miniapp_frontend/scripts/sync-version.mjs

      - name: Python and UI regression tests
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py tests/test_frontend_ui_contract.py

      - name: Install frontend dependencies
        working-directory: app/miniapp_frontend
        run: npm ci --no-audit --no-fund

      - name: Build Mini App
        working-directory: app/miniapp_frontend
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit validated v3.9.18
        shell: bash
        run: |
          rm -f .github/workflows/assistant-v3918-v2.yml
          rm -f .github/workflows/assistant-v3918.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compact match actions and country flags"
          git push origin HEAD:${GITHUB_REF_NAME}
