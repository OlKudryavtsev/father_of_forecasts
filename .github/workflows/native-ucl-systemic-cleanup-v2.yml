name: Native UCL systemic cleanup v2

on:
  push:
    branches:
      - assistant/systemic-tournament-ui-fix

permissions:
  contents: write

concurrency:
  group: assistant-systemic-tournament-ui-fix
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Apply native UCL source cleanup
        shell: bash
        run: |
          git show c65df6a84cb86ea101a4659c9c770d12deabcb4d:.github/workflows/native-ucl-systemic-cleanup.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/native_ucl_cleanup.py
          test -s /tmp/native_ucl_cleanup.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/native_ucl_cleanup.py')
          text = path.read_text(encoding='utf-8')
          old = "main = replace_once(main, old_effect, new_effect, 'TournamentHub loader')"
          new = """loader_pattern = r\"  useEffect\\(\\(\\) => \\{\\n    let active = true;\\n    api\\('/api/webapp/tournament/overview'\\).*?\\n  \\}, \\[\\]\\);\"\nmain, loader_count = re.subn(loader_pattern, lambda _match: new_effect, main, count=1, flags=re.S)\nif loader_count != 1:\n    raise SystemExit(f'Expected one TournamentHub loader, got {loader_count}')"""
          if old not in text:
              raise SystemExit('Cannot patch cleanup script loader replacement')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python /tmp/native_ucl_cleanup.py
          node app/miniapp_frontend/scripts/sync-version.mjs

      - name: Python syntax and focused identity tests
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py

      - name: Install frontend dependencies
        working-directory: app/miniapp_frontend
        shell: bash
        run: timeout --foreground --kill-after=10s 180s npm ci --no-audit --no-fund --loglevel=warn

      - name: Build Mini App
        working-directory: app/miniapp_frontend
        shell: bash
        run: timeout --foreground --kill-after=10s 120s npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit native cleanup
        shell: bash
        run: |
          rm -f .github/workflows/native-ucl-systemic-cleanup-v2.yml
          rm -f .github/workflows/native-ucl-systemic-cleanup.yml
          rm -f .github/workflows/assistant-branch-refactor.yml
          rm -f .github/workflows/apply-systemic-tournament-ui-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render UCL tournament state natively"
          git push origin HEAD:${GITHUB_REF_NAME}
