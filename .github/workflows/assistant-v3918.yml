name: Build v3.9.18 compact match cards

on:
  push:
    branches:
      - assistant/v3.9.18-compact-match-actions

permissions:
  contents: write

concurrency:
  group: assistant-v3918-compact-match-actions
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Apply compact match-card refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          main_path = root / 'app/miniapp_frontend/src/main.jsx'
          css_path = root / 'app/miniapp_frontend/src/styles.css'
          test_path = root / 'tests/test_frontend_ui_contract.py'
          package_path = root / 'app/miniapp_frontend/package.json'
          lock_path = root / 'app/miniapp_frontend/package-lock.json'

          main = main_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Cannot find {label}')
              return text.replace(old, new, 1)

          # Country flags get their own semantic class so generic team/crest
          # sizing rules cannot stretch them inside hero or match cards.
          main = replace_once(
              main,
              "function TeamFlag({ code, emoji, name = '', size = 'normal', logo = '' }) {",
              "function TeamFlag({ code, emoji, name = '', size = 'normal', logo = '', flagClassName = '' }) {",
              'TeamFlag signature',
          )
          main = replace_once(
              main,
              "  const className = `flag flag-img ${size === 'mini' ? 'mini' : ''}`.trim();",
              "  const className = `flag flag-img ${size === 'mini' ? 'mini' : ''} ${flagClassName}`.trim();",
              'TeamFlag className',
          )
          main = replace_once(
              main,
              "  return <span className={`flag ${size === 'mini' ? 'mini' : ''}`.trim()} title={name}>{emoji || '🏳️'}</span>;",
              "  return <span className={`flag ${size === 'mini' ? 'mini' : ''} ${flagClassName}`.trim()} title={name}>{emoji || '🏳️'}</span>;",
              'TeamFlag fallback className',
          )
          main = replace_once(
              main,
              '      {showCountry && <TeamFlag code={code} emoji={emoji} name={name} size="mini" />}',
              '      {showCountry && <TeamFlag code={code} emoji={emoji} name={name} size="mini" flagClassName="team-country-flag" />}',
              'country flag semantic class',
          )

          # Make the generic inline section optionally controlled/headless. This
          # lets MatchCard own the compact participants trigger without duplicating
          # participant loading or rendering logic.
          inline_pattern = re.compile(r"function MatchInlineSection\(.*?\n\}\n\nfunction visibleVideosForMatch", re.S)
          inline_replacement = r'''function MatchInlineSection({ title, meta = '', iconName = '', className = '', children, onOpen, open: controlledOpen, onOpenChange, hideHead = false }) {
            const [internalOpen, setInternalOpen] = useState(false);
            const open = controlledOpen ?? internalOpen;

            function toggleOpen() {
              const next = !open;
              if (controlledOpen === undefined) setInternalOpen(next);
              onOpenChange?.(next);
              if (next) onOpen?.();
            }

            if (hideHead && !open) return null;

            return (
              <section className={`match-inline-section ${className} ${open ? 'open' : 'closed'} ${hideHead ? 'headless' : ''}`.trim()}>
                {!hideHead && (
                  <button type="button" className="match-inline-head" onClick={toggleOpen}>
                    <span>{iconName && <Icon name={iconName} />} {title}</span>
                    <small>{meta}</small>
                    <b>{open ? '−' : '+'}</b>
                  </button>
                )}
                {open && <div className="match-inline-body">{children}</div>}
              </section>
            );
          }

          function visibleVideosForMatch'''
          main, count = inline_pattern.subn(inline_replacement, main, count=1)
          if count != 1:
              raise SystemExit(f'Expected one MatchInlineSection block, got {count}')

          main = replace_once(
              main,
              'function MatchParticipantsInline({ match, leagueId = null }) {',
              'function MatchParticipantsInline({ match, leagueId = null, open, onOpenChange, hideHead = false, onCountChange }) {',
              'MatchParticipantsInline signature',
          )
          main = replace_once(
              main,
              '  const count = data?.participants_count ?? match.prediction_distribution?.total ?? 0;\n  const participants = data?.participants || [];',
              '''  const count = data?.participants_count ?? match.prediction_distribution?.total ?? 0;
            const participants = data?.participants || [];

            useEffect(() => {
              onCountChange?.(count);
            }, [count, onCountChange]);

            useEffect(() => {
              if (open && !loaded && !error) load();
            }, [open, loaded, error, match.id, leagueId]);''',
              'MatchParticipantsInline controlled effects',
          )
          main = replace_once(
              main,
              '''      className="match-participants-block"
              onOpen={() => { if (!loaded && !error) load(); }}''',
              '''      className={`match-participants-block ${hideHead ? 'compact-participants-block' : ''}`.trim()}
              open={open}
              onOpenChange={onOpenChange}
              hideHead={hideHead}
              onOpen={() => { if (!loaded && !error) load(); }}''',
              'MatchParticipantsInline controlled props',
          )

          # Match cards: details remain accessible by tapping the match itself;
          # redundant Details button is removed. Three primary actions share a
          # single compact row on iPhone.
          main = replace_once(
              main,
              '  const hasVideos = activeVideos.length > 0;',
              '''  const hasVideos = activeVideos.length > 0;
            const [participantsOpen, setParticipantsOpen] = useState(false);
            const [participantCount, setParticipantCount] = useState(match.prediction_distribution?.total ?? 0);

            useEffect(() => {
              setParticipantsOpen(false);
              setParticipantCount(match.prediction_distribution?.total ?? 0);
            }, [match.id, match.prediction_distribution?.total]);''',
              'MatchCard participant state',
          )

          details_pattern = re.compile(r'''\n\s*\{onDetails && \(\n\s*<button type="button" className="match-details-link" onClick=\{\(\) => onDetails\(match\)\}>\n\s*<Icon name="more" />\n\s*Детали матча\n\s*</button>\n\s*\)\}\n''')
          main, count = details_pattern.subn('\n', main, count=1)
          if count != 1:
              raise SystemExit(f'Expected one redundant Details button, got {count}')

          old_actions = '''      <div className="match-actions">
                {!locked && <button onClick={() => onPredict(match)}>{match.prediction ? 'Изменить прогноз' : 'Сделать прогноз'}</button>}
                {!locked && <button onClick={() => onForecast(match)}><Icon name="robot" /> Прогноз Отца</button>}
              </div>

              <MatchVideoBlock match={match} />
              <MatchParticipantsInline match={match} leagueId={leagueId} />'''
          new_actions = '''      <div className={`match-compact-actions ${locked ? 'single-action' : ''}`}>
                {!locked && (
                  <button type="button" className="match-compact-action predict" onClick={() => onPredict(match)}>
                    <Icon name="target" />
                    <span>{match.prediction ? 'Изменить' : 'Прогноз'}</span>
                  </button>
                )}
                {!locked && (
                  <button type="button" className="match-compact-action father" onClick={() => onForecast(match)}>
                    <Icon name="robot" />
                    <span>Отец</span>
                  </button>
                )}
                <button
                  type="button"
                  className={`match-compact-action participants ${participantsOpen ? 'active' : ''}`}
                  aria-expanded={participantsOpen}
                  onClick={() => setParticipantsOpen((value) => !value)}
                >
                  <Icon name="target" />
                  <span>Участ. {participantCount}</span>
                </button>
              </div>

              <MatchVideoBlock match={match} />
              <MatchParticipantsInline
                match={match}
                leagueId={leagueId}
                open={participantsOpen}
                onOpenChange={setParticipantsOpen}
                hideHead
                onCountChange={setParticipantCount}
              />'''
          main = replace_once(main, old_actions, new_actions, 'compact match actions')
          main_path.write_text(main, encoding='utf-8')

          marker = '/* v3.9.18 — compact match actions and stable country-flag geometry */'
          if marker not in css:
              css += r'''

          /* v3.9.18 — compact match actions and stable country-flag geometry */
          .team-name-with-country > .flag.team-country-flag {
            width: 22px;
            min-width: 22px;
            max-width: 22px;
            height: 16px;
            min-height: 16px;
            max-height: 16px;
            flex: 0 0 22px;
            aspect-ratio: 11 / 8;
            padding: 0;
            border-radius: 3px;
            overflow: hidden;
            align-self: center;
          }

          .team-name-with-country > .flag.team-country-flag > img {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            object-position: center;
          }

          .next-match-team .team-name-with-country > .flag.team-country-flag,
          .team-side .team-name-with-country > .flag.team-country-flag {
            width: 22px;
            min-width: 22px;
            max-width: 22px;
            height: 16px;
            min-height: 16px;
            max-height: 16px;
            flex-basis: 22px;
          }

          .match-compact-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin: 8px 0 0;
          }

          .match-compact-actions.single-action {
            grid-template-columns: 1fr;
          }

          .match-compact-action {
            min-width: 0;
            min-height: 40px;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 12px;
            color: var(--muted);
            background: rgba(255,255,255,.035);
            font-size: 11px;
            font-weight: 850;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
          }

          .match-compact-action .svg-icon {
            width: 15px;
            height: 15px;
            flex: 0 0 15px;
          }

          .match-compact-action span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .match-compact-action.predict {
            color: #c8d8ff;
            background: rgba(90, 141, 255, .08);
            border-color: rgba(90, 141, 255, .15);
          }

          .match-compact-action.father {
            color: var(--green);
            background: rgba(22, 199, 132, .12);
            border-color: rgba(22, 199, 132, .20);
          }

          .match-compact-action.participants {
            color: #9bd8c8;
            background: rgba(22, 199, 132, .06);
          }

          .match-compact-action.participants.active {
            color: var(--green);
            border-color: rgba(22, 199, 132, .34);
            background: rgba(22, 199, 132, .14);
          }

          .match-inline-section.headless {
            margin-top: 8px;
          }

          .match-inline-section.headless .match-inline-body {
            border-top: 0;
          }

          @media (max-width: 390px) {
            .match-compact-actions { gap: 5px; }
            .match-compact-action { min-height: 38px; padding: 0 6px; font-size: 10px; gap: 4px; }
            .match-compact-action .svg-icon { width: 14px; height: 14px; flex-basis: 14px; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          if 'test_compact_match_card_actions_and_country_flag_geometry' not in tests:
              tests += r'''

          def test_compact_match_card_actions_and_country_flag_geometry():
              assert 'flagClassName="team-country-flag"' in MAIN
              country = CSS.split('/* v3.9.18 — compact match actions and stable country-flag geometry */', 1)[1]
              assert '.team-name-with-country > .flag.team-country-flag' in country
              assert 'width: 22px;' in country
              assert 'height: 16px;' in country
              assert 'grid-template-columns: repeat(3, minmax(0, 1fr));' in country
              assert 'className="match-details-link"' not in MAIN
              assert '<span>Отец</span>' in MAIN
              assert '<span>Участ. {participantCount}</span>' in MAIN
              assert 'hideHead' in MAIN
          '''
          test_path.write_text(tests, encoding='utf-8')

          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package.get('version') != '3.9.17':
              raise SystemExit(f"Unexpected package version {package.get('version')}")
          package['version'] = '3.9.18'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = '3.9.18'
          if '' in lock.get('packages', {}):
              lock['packages']['']['version'] = '3.9.18'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Sync app version assets
        run: node app/miniapp_frontend/scripts/sync-version.mjs

      - name: Python and UI regression tests
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py tests/test_frontend_ui_contract.py

      - name: Install frontend dependencies
        working-directory: app/miniapp_frontend
        run: npm ci --no-audit --no-fund

      - name: Build Mini App
        working-directory: app/miniapp_frontend
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit validated v3.9.18
        shell: bash
        run: |
          rm -f .github/workflows/assistant-v3918.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compact match actions and country flags"
          git push origin HEAD:${GITHUB_REF_NAME}
