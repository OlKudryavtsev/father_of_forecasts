name: Native UCL systemic cleanup

on:
  push:
    branches:
      - assistant/systemic-tournament-ui-fix

permissions:
  contents: write

concurrency:
  group: assistant-systemic-tournament-ui-fix
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Move UCL league phase into native React
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          main_path = root / 'app/miniapp_frontend/src/main.jsx'
          main = main_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Cannot find {label}')
              return text.replace(old, new, 1)

          helper = r'''
          function buildUclLeaguePhaseStandings(matches = []) {
            const phaseMatches = (matches || []).filter((match) => {
              const stage = String(match.stage || '').toLowerCase();
              const round = String(match.match_round || '').toLowerCase();
              const phase = `${stage} ${round}`;
              return phase.includes('league') || phase.includes('group') || phase.includes('matchday') || phase.includes('regular season');
            });
            const source = phaseMatches.length ? phaseMatches : (matches || []).filter((match) => {
              const phase = `${String(match.stage || '').toLowerCase()} ${String(match.match_round || '').toLowerCase()}`;
              return !/(qualif|play.?off|round of|1\/8|1\/4|quarter|semi|final)/.test(phase);
            });
            const rows = new Map();

            function ensure(id, name, flag, flagCode, logo) {
              const key = id ? `id:${id}` : `name:${String(name || '').toLowerCase()}`;
              if (!rows.has(key)) {
                rows.set(key, {
                  key,
                  id,
                  name,
                  flag,
                  flag_code: flagCode,
                  logo,
                  played: 0,
                  wins: 0,
                  draws: 0,
                  losses: 0,
                  gf: 0,
                  ga: 0,
                  points: 0,
                });
              }
              return rows.get(key);
            }

            source.forEach((match) => {
              const home = ensure(match.home_team_id, match.home_team, match.home_flag, match.home_flag_code, match.home_logo);
              const away = ensure(match.away_team_id, match.away_team, match.away_flag, match.away_flag_code, match.away_logo);
              if (!match.is_finished || match.score_home === null || match.score_home === undefined || match.score_away === null || match.score_away === undefined) return;
              const homeScore = Number(match.score_home);
              const awayScore = Number(match.score_away);
              if (!Number.isFinite(homeScore) || !Number.isFinite(awayScore)) return;
              home.played += 1;
              away.played += 1;
              home.gf += homeScore;
              home.ga += awayScore;
              away.gf += awayScore;
              away.ga += homeScore;
              if (homeScore > awayScore) {
                home.wins += 1;
                away.losses += 1;
                home.points += 3;
              } else if (awayScore > homeScore) {
                away.wins += 1;
                home.losses += 1;
                away.points += 3;
              } else {
                home.draws += 1;
                away.draws += 1;
                home.points += 1;
                away.points += 1;
              }
            });

            return [...rows.values()].sort((left, right) =>
              right.points - left.points ||
              (right.gf - right.ga) - (left.gf - left.ga) ||
              right.gf - left.gf ||
              String(left.name || '').localeCompare(String(right.name || ''), 'ru')
            );
          }

          function UclLeaguePhaseTable({ matches = [] }) {
            const rows = useMemo(() => buildUclLeaguePhaseStandings(matches), [matches]);
            if (!rows.length) {
              return <DetailEmpty title="Общий этап пока не заполнен" text="Матчи появятся здесь после синхронизации расписания Лиги чемпионов." />;
            }

            return (
              <section className="ucl-league-phase-panel">
                <header className="ucl-phase-head">
                  <div><span className="section-label">Лига чемпионов 2026/27</span><h2>Общий этап</h2></div>
                  <small>{rows.length} клубов · 8 туров</small>
                </header>
                <p className="ucl-phase-note"><span className="ucl-legend direct" />1–8 — 1/8 <span className="ucl-legend playoff" />9–24 — стыки <span className="ucl-legend out" />25–36 — вылет</p>
                <div className="ucl-table-scroll">
                  <table className="ucl-phase-table">
                    <thead><tr><th>#</th><th>Клуб</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>М</th><th>±</th><th>О</th></tr></thead>
                    <tbody>
                      {rows.map((row, index) => {
                        const goalDifference = row.gf - row.ga;
                        const zone = index < 8 ? 'direct' : index < 24 ? 'playoff' : 'out';
                        return <tr key={row.key} className={`ucl-${zone}`}>
                          <td>{index + 1}</td>
                          <td><span className="ucl-table-club"><TeamFlag code={row.flag_code} emoji={row.flag} logo={row.logo} name={row.name} size="mini" /><strong>{row.name}</strong></span></td>
                          <td>{row.played}</td><td>{row.wins}</td><td>{row.draws}</td><td>{row.losses}</td><td>{row.gf}:{row.ga}</td><td>{goalDifference > 0 ? '+' : ''}{goalDifference}</td><td><b>{row.points}</b></td>
                        </tr>;
                      })}
                    </tbody>
                  </table>
                </div>
              </section>
            );
          }

          '''.lstrip()

          marker = 'function TournamentHub({ mode = \'tournament\', onModeChange, onOpenMatch, onOpenTeam, onOpenPlayer }) {'
          if 'function UclLeaguePhaseTable(' not in main:
              main = replace_once(main, marker, helper + "function TournamentHub({ mode = 'tournament', onModeChange, onOpenMatch, onOpenTeam, onOpenPlayer, activeTournamentCode = 'wc2026' }) {", 'TournamentHub signature')
          else:
              main = replace_once(main, marker, "function TournamentHub({ mode = 'tournament', onModeChange, onOpenMatch, onOpenTeam, onOpenPlayer, activeTournamentCode = 'wc2026' }) {", 'TournamentHub signature')

          old_effect = r'''  useEffect(() => {
            let active = true;
            api('/api/webapp/tournament/overview').then((result) => {
              if (!active) return;
              setData(result);
              const available = (result.groups || []).map((group) => group.group_code);
              const defaults = (result.default_group_codes || []).filter((code) => available.includes(code));
              setSelectedGroups((current) => {
                const validCurrent = current.filter((code) => available.includes(code));
                if (validCurrent.length) return validCurrent;
                return defaults.length ? defaults : available.slice(0, 1);
              });
              const knockoutStages = (result.knockout?.stages || []).filter((stage) => (stage.matches || []).length);
              setSelectedKnockoutStage((current) => knockoutStages.some((stage) => stage.key === current) ? current : (knockoutStages[0]?.key || null));
            }).catch((err) => { if (active) setError(err); });
            return () => { active = false; };
          }, []);'''

          new_effect = r'''  const isUclTournament = String(activeTournamentCode || '').toLowerCase().startsWith('ucl_');

            useEffect(() => {
              let active = true;
              const controller = new AbortController();
              setData(null);
              setError(null);

              const endpoint = isUclTournament
                ? `/api/webapp/matches?scope=all&tournament_code=${encodeURIComponent(activeTournamentCode)}`
                : '/api/webapp/tournament/overview';

              api(endpoint, { signal: controller.signal }).then((result) => {
                if (!active || controller.signal.aborted) return;
                if (isUclTournament) {
                  const mismatchedMatch = (result.matches || []).find((match) => match.tournament_code && match.tournament_code !== activeTournamentCode);
                  if (mismatchedMatch) return;
                  setData({ league_phase_matches: result.matches || [], groups: [], knockout: { stages: [] }, top_scorers: { items: [] } });
                  return;
                }

                setData(result);
                const available = (result.groups || []).map((group) => group.group_code);
                const defaults = (result.default_group_codes || []).filter((code) => available.includes(code));
                setSelectedGroups((current) => {
                  const validCurrent = current.filter((code) => available.includes(code));
                  if (validCurrent.length) return validCurrent;
                  return defaults.length ? defaults : available.slice(0, 1);
                });
                const knockoutStages = (result.knockout?.stages || []).filter((stage) => (stage.matches || []).length);
                setSelectedKnockoutStage((current) => knockoutStages.some((stage) => stage.key === current) ? current : (knockoutStages[0]?.key || null));
              }).catch((err) => {
                if (!active || controller.signal.aborted || err?.name === 'AbortError') return;
                setError(err);
              });

              return () => {
                active = false;
                controller.abort();
              };
            }, [activeTournamentCode, isUclTournament]);'''

          main = replace_once(main, old_effect, new_effect, 'TournamentHub loader')

          loading = '  if (!data) return <LoadingCard text="Загружаю турнирный центр..." />;\n\n  const groups = data.groups || [];'
          native_ucl = r'''  if (!data) return <LoadingCard text="Загружаю турнирный центр..." />;

            if (isUclTournament) {
              if (mode !== 'tournament') {
                return <div className="tournament-hub"><section className="hub-scorers-card"><DetailEmpty title="Бомбардиры Лиги чемпионов пока не подключены" text="Здесь не показываются данные другого турнира; раздел появится после подключения клубной статистики." /></section></div>;
              }
              return <div className="tournament-hub"><UclLeaguePhaseTable matches={data.league_phase_matches || []} /></div>;
            }

            const groups = data.groups || [];'''
          main = replace_once(main, loading, native_ucl, 'native UCL branch')

          old_hub_call = '<TournamentHub mode={centerMode} onModeChange={changeCenterMode} onOpenMatch={openMatch} onOpenTeam={openTeam} onOpenPlayer={openPlayer} />'
          new_hub_call = '<TournamentHub mode={centerMode} onModeChange={changeCenterMode} onOpenMatch={openMatch} onOpenTeam={openTeam} onOpenPlayer={openPlayer} activeTournamentCode={activeTournamentCode} />'
          main = replace_once(main, old_hub_call, new_hub_call, 'MatchCenter TournamentHub props')
          main_path.write_text(main, encoding='utf-8')

          index_path = root / 'app/miniapp_frontend/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('    <script type="module" src="/src/ucl_ui_patch.js"></script>\n', '')
          index_path.write_text(index, encoding='utf-8')
          (root / 'app/miniapp_frontend/src/ucl_ui_patch.js').unlink(missing_ok=True)

          css_path = root / 'app/miniapp_frontend/src/styles.css'
          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* Native UCL league-phase table (v3.9.15) */'
          if css_marker not in css:
              css += r'''

          /* Native UCL league-phase table (v3.9.15) */
          .ucl-league-phase-panel { padding: 12px; border: 1px solid rgba(116,146,209,.25); border-radius: 18px; background: #121a2c; }
          .ucl-phase-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-end; }
          .ucl-phase-head h2 { margin: 2px 0 0; }
          .ucl-phase-head small { color: #96a2bc; font-size: 11px; white-space: nowrap; }
          .ucl-phase-note { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; color: #96a2bc; font-size: 10px; }
          .ucl-legend { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
          .ucl-legend.direct { background: #16d391; }
          .ucl-legend.playoff { background: #ffbf35; }
          .ucl-legend.out { background: #657089; }
          .ucl-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
          .ucl-phase-table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 11px; }
          .ucl-phase-table th, .ucl-phase-table td { padding: 7px 4px; text-align: center; border-bottom: 1px solid rgba(148,163,184,.12); }
          .ucl-phase-table th:nth-child(2), .ucl-phase-table td:nth-child(2) { text-align: left; }
          .ucl-table-club { display: flex; align-items: center; gap: 6px; min-width: 0; }
          .ucl-table-club .flag { flex: 0 0 auto; }
          .ucl-table-club strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          .ucl-phase-table tr.ucl-direct td:first-child { border-left: 3px solid #16d391; }
          .ucl-phase-table tr.ucl-playoff td:first-child { border-left: 3px solid #ffbf35; }
          .ucl-phase-table tr.ucl-out { opacity: .72; }
          '''
          css_path.write_text(css, encoding='utf-8')

          package_path = root / 'app/miniapp_frontend/package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package.get('version') == '3.9.14':
              package['version'] = '3.9.15'
              package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          elif package.get('version') != '3.9.15':
              raise SystemExit(f"Unexpected package version: {package.get('version')}")
          PY
          node app/miniapp_frontend/scripts/sync-version.mjs

      - name: Python syntax and focused identity tests
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py

      - name: Install frontend dependencies
        working-directory: app/miniapp_frontend
        shell: bash
        run: timeout --foreground --kill-after=10s 180s npm ci --no-audit --no-fund --loglevel=warn

      - name: Build Mini App
        working-directory: app/miniapp_frontend
        shell: bash
        run: timeout --foreground --kill-after=10s 120s npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit native cleanup
        shell: bash
        run: |
          rm -f .github/workflows/native-ucl-systemic-cleanup.yml
          rm -f .github/workflows/assistant-branch-refactor.yml
          rm -f .github/workflows/apply-systemic-tournament-ui-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render UCL tournament state natively"
          git push origin HEAD:${GITHUB_REF_NAME}
