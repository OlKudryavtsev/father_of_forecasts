name: Build v3.9.17 header and club identity

on:
  push:
    branches:
      - assistant/v3.9.17-header-club-identity

permissions:
  contents: write

concurrency:
  group: assistant-v3917-header-club-identity
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Apply systematic UI refactor
        run: python .github/assistant_v3917_patch.py

      - name: Sync app version assets
        run: node app/miniapp_frontend/scripts/sync-version.mjs

      - name: Python and regression tests
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py tests/test_frontend_ui_contract.py

      - name: Install frontend dependencies
        working-directory: app/miniapp_frontend
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm ci --no-audit --no-fund --loglevel=warn

      - name: Build Mini App
        working-directory: app/miniapp_frontend
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit validated v3.9.17
        shell: bash
        run: |
          rm -f .github/assistant_v3917_patch.py .github/workflows/assistant-v3917.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align header grid and club identity"
          git push origin HEAD:${GITHUB_REF_NAME}
