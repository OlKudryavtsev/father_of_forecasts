name: Assistant branch refactor

on:
  push:
    branches:
      - assistant/systemic-tournament-ui-fix

permissions:
  contents: write

concurrency:
  group: assistant-systemic-tournament-ui-fix
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Apply source refactor
        shell: bash
        run: |
          git show 880c08e0434ba658474263411f0baa6bb2ad11d0:.github/workflows/apply-systemic-tournament-ui-fix.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/apply_systemic_fix.py
          test -s /tmp/apply_systemic_fix.py
          mkdir -p tests
          python /tmp/apply_systemic_fix.py
          rm -f .github/workflows/assistant-branch-refactor.yml
          rm -f .github/workflows/apply-systemic-tournament-ui-fix.yml

      - name: Python syntax and focused identity tests
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py

      - name: Validate source diff
        run: git diff --check

      - name: Commit and publish reviewed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make tournament UI state and team identity canonical"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Build Mini App with diagnostics
        working-directory: app/miniapp_frontend
        shell: bash
        run: |
          echo "npm ci started at $(date -u +%FT%TZ)"
          timeout 180s npm ci --no-audit --no-fund --loglevel=verbose
          echo "vite build started at $(date -u +%FT%TZ)"
          timeout 120s npm run build
          echo "build finished at $(date -u +%FT%TZ)"
