name: Finalize systemic UI regressions v2

on:
  push:
    branches:
      - assistant/systemic-tournament-ui-fix

permissions:
  contents: write

concurrency:
  group: assistant-systemic-tournament-ui-fix-final
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/miniapp_frontend/package-lock.json

      - name: Port remaining runtime behavior into native code
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/finalize.py
          python /tmp/finalize.py
          rm -f app/miniapp_frontend/public/ui_compact_v3913.js
          rm -f app/miniapp_frontend/public/header_unified_v3914.js
          rm -f app/miniapp_frontend/src/ucl_ui_patch_v397.js
          node app/miniapp_frontend/scripts/sync-version.mjs

      - name: Verify retired patches are fully replaced
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          webapp = Path('app/api/webapp.py').read_text(encoding='utf-8')
          css = Path('app/miniapp_frontend/src/styles.css').read_text(encoding='utf-8')
          index = Path('app/miniapp_frontend/index.html').read_text(encoding='utf-8')
          assert 'row.get("user_id") == current_user.id' in webapp
          assert 'Native replacements for retired runtime UI patches (v3.9.16)' in css
          for value in ('ui_compact_v3913.js', 'header_unified_v3914.js', 'ucl_ui_patch_v397.js', 'ucl_ui_patch.js'):
              assert value not in index
          PY
          test ! -e app/miniapp_frontend/public/ui_compact_v3913.js
          test ! -e app/miniapp_frontend/public/header_unified_v3914.js
          test ! -e app/miniapp_frontend/src/ucl_ui_patch_v397.js

      - name: Python checks
        run: |
          python -m compileall -q app
          python -m pip install -q pytest
          python -m pytest -q tests/test_team_identity.py

      - name: Install frontend dependencies
        working-directory: app/miniapp_frontend
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: timeout --foreground --kill-after=10s 180s npm ci --no-audit --no-fund --loglevel=warn

      - name: Build Mini App
        working-directory: app/miniapp_frontend
        run: timeout --foreground --kill-after=10s 120s npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit final native cleanup
        shell: bash
        run: |
          rm -f .github/workflows/finalize-systemic-ui-regressions-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: retire remaining runtime UI patches"
          git push origin HEAD:${GITHUB_REF_NAME}
